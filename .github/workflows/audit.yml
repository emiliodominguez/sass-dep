name: Security audit

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - web/package-lock.json
      - .github/workflows/audit.yml
  workflow_dispatch:

jobs:
  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  npm:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=moderate
