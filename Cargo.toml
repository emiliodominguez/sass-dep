[package]
name = "sass-dep"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Emilio Dominguez"]
description = "Rust CLI for mapping Sass and SCSS dependencies, finding circular imports and enforcing architecture rules, with graph exports and an interactive visualizer."
license = "MIT"
repository = "https://github.com/emiliodominguez/sass-dep"
readme = "README.md"
keywords = ["sass", "scss", "dependency-graph", "cli", "css"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
exclude = ["docs/assets/*", "docs/screenshot.png", "web/node_modules/*"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.4", features = ["derive"] }
dunce = "1.0"
globset = "0.4"
ignore = "0.4"
indexmap = { version = "2.0", features = ["serde"] }
petgraph = { version = "0.6", default-features = false }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = { version = "0.8", default-features = false, features = ["parse"] }

# Web server dependencies
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
mime_guess = "2"
open = "5"
rust-embed = "8"
tokio = { version = "1", features = ["rt", "net", "signal", "macros"] }
tower-http = { version = "0.5", features = ["compression-gzip"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
